services:
  crewfest:
    build: .
    # After a release, swap the line above for the published image and comment
    # `build: .` out (or remove it) to run without a local build:
    # image: ghcr.io/arengia/crewfest:latest
    container_name: crewfest
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      # Optional (`required: false` needs Docker Compose v2.24+; drop that line on
      # older Compose if it errors, and just don't use env_file). Copy .env.example
      # to .env to use this — handy for ADMIN_USERNAME/ADMIN_PASSWORD/CREW_PASSWORD
      # below without having to edit this file.
      #
      # Gotcha: this is a SEPARATE mechanism from Compose's own top-level `.env`,
      # which it auto-reads from the project directory for ${VAR} substitution
      # below (e.g. SESSION_SECRET). Same filename, two different jobs — if you
      # keep one .env with everything in it, both happen to work off of it.
      - path: .env
        required: false
    environment:
      # ── Required ──────────────────────────────────────────────────────────────
      # Long random string, e.g. `openssl rand -hex 32`. The app refuses to start in
      # production if this is missing or left as a "change-me" placeholder.
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set — generate one with `openssl rand -hex 32`}

      # ── Paths (match the Dockerfile's defaults — only change if you know why) ──
      NODE_ENV: production
      DB_PATH: /data/crewfest.db
      UPLOADS_DIR: /data/uploads
      PORT: 3001

      # Cookie "Secure" flag. Defaults to true (NODE_ENV=production above), which
      # requires HTTPS or the login cookie gets dropped and you hit a login loop.
      # This is NOT active by default here — the secure default (true) is the
      # right choice unless you know you're serving plain HTTP. Uncomment the
      # line below only if you're serving over plain HTTP without a
      # TLS-terminating reverse proxy in front (e.g. http://<host>:3001 on a
      # LAN) — understand that session/crew cookies then travel unencrypted.
      # COOKIE_SECURE: "false"

      # Optional: creates the admin on first boot (or resets the password if the
      # account already exists) — remove both once set up to avoid accidental resets.
      # ADMIN_USERNAME: admin
      # ADMIN_PASSWORD: change-me

      # Optional: password gate for the read-only /crew capacity page. Leave unset
      # to keep /crew closed.
      # CREW_PASSWORD: change-me
    volumes:
      - crewfest-data:/data
      # Bind-mount alternative instead of the named volume above — remember to
      # `chown -R 1000:1000 ./crewfest-data` on the host first (see Dockerfile):
      # - ./crewfest-data:/data

volumes:
  crewfest-data:
